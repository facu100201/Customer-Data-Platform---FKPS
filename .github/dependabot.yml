version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (compilador nativo) aún no es compatible con typescript-eslint ni con tsup
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Prisma 7 exige prisma.config.ts y driver adapters: migración aparte, no un bump automático
      - dependency-name: prisma
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
