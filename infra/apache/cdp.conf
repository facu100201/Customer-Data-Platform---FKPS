# ---------------------------------------------------------------------------
# CDP FKPS - VirtualHost para Apache 2.4 (Apache Lounge, Windows)
#
# 1. En C:\Apache24\conf\httpd.conf quita el "#" de estas líneas:
#      LoadModule headers_module modules/mod_headers.so
#      LoadModule proxy_module modules/mod_proxy.so
#      LoadModule proxy_http_module modules/mod_proxy_http.so
#      LoadModule rewrite_module modules/mod_rewrite.so
# 2. Copia este archivo a C:\Apache24\conf\extra\cdp.conf (deploy.ps1 lo hace solo)
# 3. Agrega al final de httpd.conf:   Include conf/extra/cdp.conf
# 4. Ajusta ZT_SUBNET a la subred de tu red ZeroTier (my.zerotier.com > Managed Routes)
# 5. C:\Apache24\bin\httpd.exe -t   y luego   httpd.exe -k restart
#
# Al ser el primer VirtualHost en *:80, atiende cualquier petición por IP.
# ---------------------------------------------------------------------------

Define CDP_ROOT "c:/Apache24/htdocs/cdp"
Define ZT_SUBNET "10.147.20.0/24"
Define CDP_API "http://127.0.0.1:3000"

<VirtualHost *:80>
    ServerName cdp.fkps.local
    DocumentRoot "${CDP_ROOT}"

    # Solo la red ZeroTier y el propio servidor pueden entrar (además del firewall)
    <Location "/">
        Require ip ${ZT_SUBNET} 127.0.0.1 ::1
    </Location>

    <Directory "${CDP_ROOT}">
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require ip ${ZT_SUBNET} 127.0.0.1 ::1

        # React es una SPA: toda ruta que no sea un archivo real se sirve con index.html
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [L]
    </Directory>

    # --- API Node.js (solo escucha en localhost) ---
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 60
    # SSE del dashboard: sin buffer y con timeout largo
    ProxyPass        /api/stream ${CDP_API}/api/stream flushpackets=on timeout=3600
    ProxyPassReverse /api/stream ${CDP_API}/api/stream
    ProxyPass        /api/ ${CDP_API}/api/ retry=2
    ProxyPassReverse /api/ ${CDP_API}/api/
    <Location "/api/">
        LimitRequestBody 1048576
    </Location>

    # --- Cabeceras de seguridad ---
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Header always unset X-Powered-By

    # Los assets de Vite llevan hash en el nombre: se pueden cachear un año
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    # Formato combined: el Sentinel necesita IP, ruta, estado y user-agent
    ErrorLog "logs/error.log"
    CustomLog "logs/access.log" combined
</VirtualHost>
